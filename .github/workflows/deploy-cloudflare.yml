name: Deploy Nuxt 2 Static Site

on:
  push:
    branches:
      - master # Change if you use a different default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js (optional, you can set version)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16" # Matches Nuxt 2 compatibility

      # 3. Install dependencies & generate static site
      - name: Build Nuxt Project
        run: npm install && npm run generate

      # 4. Add .nojekyll to dist folder
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 5. Configure git identity for gh-pages commit
      - name: Configure git credentials
        uses: OleksiyRudenko/gha-git-credentials@v2.1.2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"

      # 6. Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          directory: ./dist
        run: npx gh-pages -d dist
