name: Deploy Nuxt 2 Static Site

on:
  push:
    branches:
      - master # Change if you use a different default branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Node.js (optional, you can set version)
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16" # Matches Nuxt 2 compatibility

      # 3. Install dependencies & generate static site
      - name: Build Nuxt Project
        run: npm install && npm run generate

      # 4. Add .nojekyll to dist folder
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      # 5. Deploy to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx gh-pages -d dist -r https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
